<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Sistema Actividad 5 </title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/login.css">
    </head>

    <body>
        <main class="container min-vh-100 d-flex align-items-center">
            <div class="row w-100 justify-content-center">
                <div class="col-12 col-sm-9 col-md-6 col-lg-4">
                    <div class="card shadow">
                        <div class="card-body p-4">
                            <h1 class="h3 text-center mb-4">
                                Iniciar sesion
                            </h1>
                            <form id="formLogin" novalidate>
                                <div class="mb-3">
                                    <label for="loginCorreo" class="form-label">
                                        Correo
                                    </label>
                                    <input type="email" class="form-control" id="loginCorreo" placeholder="cor@gmail.com" autocomplete="username">
                                    <div class="invalid-feedback" id="errorLoginCorreo"></div>
                                </div>
                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label">Contrasena</label>
                                    <input type="password" class="form-control" id="loginPassword" autocomplete="current-password">
                                    <div class="invalid-feeback" id="errorLoginPassword"></div>
                                </div>
                                <div class="alert alert-danger d-done" id="mensajeLogin" role="alert"></div>
                                <button type="submit" class="btn btn-primary w-100">Entrar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/gh/DaniielA5/utileria-js@main/js/utileria.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
