<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial0-scale=1.0">
        <title>Sistm - Actividad 5 </title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/index.css">

    </head>
    <body>
        <nav class="navbar navbar-dark bg-dark sticky-top px-3">
            <div class="d-flex align-items-center">
                <button class="navbar-toggler me-3" type="button" id="btnHamburguesa" aria-label="Abrir/cerrar menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <span class="navbar-brand mb-0 h1">Sistema Actividad 5</span>
            </div>

            <div class="dropdown">
                <button class="btn btn-outline-light dropdown-toggle" type="button" id="menuUsuario" data-bs-toggle="dropdown" aria-expanded="false">
                    <span id="nombreUsuario">Usuario</span>

                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="menuUsuario">
                    <li><button class="dropdown-item" type="button" id="btnSalir">Salir del Sistema</button></li>
                </ul>
            </div>
        </nav>

            <div class="d-flex" id="contenedor"> 
        <!-- =====================================================
            CHAY         SIDEBAR 
            TAREA: construir el menú lateral dentro del <aside>.
             - Opciones: Inicio, Usuarios y Alumnos.
             - "Usuarios" debe desplegar un submenú con la opción "Captura".
               (Pista: Bootstrap ya trae "collapse", busca data-bs-toggle="collapse")
             - Cada opción que muestre una sección lleva un atributo data-seccion
               con el id de esa sección. Ejemplo: data-seccion="seccion-alumnos"
             - NO quites id="sidebar": el CSS y el JS lo usan.
             ===================================================== -->          
        <aside id="sidebar">
            <div class="p-3 bg-light border-end" style="width: 250px; min-height: 100vh;">
                <ul class="nav flex-column">
                     <li class="nav-item mb-2">
                        <a href="#" class="nav-link text-dark" data-seccion="seccion-inicio">Inicio</a>
                    </li>
                    <li class="nav-item mb-2">
                    <!-- Opción Usuarios con submenú desplegable -->
                     <a href="#menuUsuariosSub" class="nav-link text-dark d-flex justify-content-between align-items-center" data-bs-toggle="collapse" aria-expanded="false">
                        Usuarios <span>▼</span>
                    </a>
                    <ul class="collapse list-unstyled ps-3 mt-1" id="menuUsuariosSub">
                        <li>
                            <a href="#" class="nav-link text-secondary" data-seccion="seccion-captura">Captura</a>
                        </li>
                    </ul>
                </li>
                <li class="nav-item mb-2">
                     <a href="#" class="nav-link text-dark" data-seccion="seccion-alumnos">Alumnos</a>
                    </li>
                </ul>
            </div>
    </aside>

        <main id="contenido" class="flex-grow-1 p-4">

            <section id="seccion-inicio" class="seccion">
                <h2>Bienvenido al sistema</h2>
                <p>Selecciona una opción del menú lateral.</p>
            </section>

            <!-- =====================================================
                CHAY       SECCIÓN CAPTURA DE USUARIOS 
                 TAREA: formulario con nombre de usuario, correo electrónico y contraseña.
                 - Validar con validarCorreo() y validarPassword() de utileria.js
                 - Mostrar el error debajo de cada campo (mira cómo lo hice en login.html:
                   clases is-invalid e invalid-feedback de Bootstrap)
                 - Poner novalidate en el <form> para que validen tus funciones
                 - Si todo es válido, mostrar un mensaje de éxito
                 ===================================================== -->
            <section id="seccion-captura" class="seccion d-none">
                <div class="card shadow p-4">
                    <h3 class="mb-3">Captura de Usuarios</h3>
                    <form id="formCapturaUsuario" novalidate>
                <div class="mb-3">
                    <label for="nombreCap" class="form-label">Nombre de usuario</label>
                    <input type="text" class="form-control" id="nombreCap" required>
                    <div class="invalid-feedback">Por favor ingresa un nombre válido.</div>
                </div>
                <div class="mb-3">
                    <label for="correoCap" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correoCap" required>
                    <div class="invalid-feedback" id="errorCorreoCap">Correo inválido.</div>
                </div>
                <div class="mb-3">
                    <label for="passCap" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="passCap" required>
                    <div class="invalid-feedback" id="errorPassCap">Contraseña inválida.</div>
                </div>
                <div class="alert alert-success d-none" id="exitoCaptura">¡Usuario guardado con éxito!</div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </section>

            <!-- =====================================================
                 CHAY               SECCIÓN ALUMNOS



                 TAREA: formulario con nombre, número de control y fecha de nacimiento.
                 - Nombre: validar con soloLetras()
                 - Número de control: exactamente 6 dígitos, solo números.
                   OJO: validarLongitud() solo revisa un MÁXIMO. Para pedir
                   exactamente 6 tienes que comprobar también la longitud mínima.
                 - Fecha de nacimiento: sirve para calcular la edad en el modal
                 - Si todo es válido, abrir el modal de edad (ver más abajo)
                 ===================================================== -->
            <section id="seccion-alumnos" class="seccion d-none">
            </section>

        </main>
    </div>

    <!-- =====================================================
        CHAY            MODAL DE EDAD


        
         TAREA: modal de Bootstrap (class="modal fade", id="modalEdad") que muestre:
         nombre del alumno, número de control, edad y si es mayor de edad o no.
         - Usar calcularEdad() y esMayorDeEdad() de utileria.js
         - Para abrirlo desde JS, busca "new bootstrap.Modal" en la documentación de Bootstrap
         ===================================================== -->

        <!-- chay -->
        <!--   modal edad  -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>      
        <script src="https://cdn.jsdelivr.net/gh/DaniielA5/utileria-js@main/js/utileria.js"></script>
        <script src="js/index.js"></script>
    
    </body>
</html>
